<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments for Hussain's Site</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="icon" href="sourceimg/a-big-flame-clearbg.png">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
  </head>

<body>
  <a href="index.html"><img src="sourceimg/a-big-flame-clearbg.png" width="266" height="152" alt="Flame Logo"/></a>
  <h2>Visitor Comments!</h2>
  
  <div class="nav-links">
    <a href='index.html'>Home</a>
    <a href='comments.html'>Comments</a>
    <a href='proj.html'>Project</a>
    <a href='404.html'>Transit</a>
    <a href='gallery.html'>Gallery</a>
  </div>

  <div class="form-panel">
    <div class="form-head">
      <div class="form-head-title">RATE THE SITE</div>
      <div class="form-head-sub">All entries reviewed</div>
    </div>
    <div class="form-body" id="the-form">
      <div class="f-group">
        <label class="f-label">Full Name</label>
        <input class="f-input" type="text" placeholder="Your name">
      </div>
      <div class="f-group">
        <label class="f-label">City, Country</label>
        <input class="f-input" type="text" placeholder="Where you're from">
      </div>
      <div class="f-group">
        <label class="f-label">Rating</label>
        <div class="stars-row" id="star-row">
          <span class="star" onclick="rate(1)">★</span>
          <span class="star" onclick="rate(2)">★</span>
          <span class="star" onclick="rate(3)">★</span>
          <span class="star" onclick="rate(4)">★</span>
          <span class="star" onclick="rate(5)">★</span>
        </div>
      </div>
      <div class="f-group">
        <label class="f-label">Personal Comment</label>
        <textarea class="f-textarea" placeholder="What was your experience of the site?"></textarea>
      </div>
      <button class="f-submit" onclick="submit()">Submit Entry →</button>
    </div>
    <div class="success" id="success">
      <div class="s-mark">✓</div>
      <div class="s-text">Entry received.<br>We'll read it carefully.<br>Published within 48 hours.</div>
    </div>
  </div>

  <div class="social-links">
    <a href="https://www.instagram.com/hussain.m.multanwala/"><i class="bi bi-instagram"></i></a>
    <a href="https://github.com/PerfectCoder05"><i class="bi bi-github"></i></a>
  </div>

<footer>
  hussain05.murtaza@gmail.com | © Hussain Murtaza 2026
</footer>

</body>
</html>
